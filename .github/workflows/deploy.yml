name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the public site
        run: |
          mkdir -p /tmp/site
          cp -R index.html styles.css assets robots.txt sitemap.xml _headers /tmp/site/
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy /tmp/site --project-name=rhizosat --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

